
{% extends "base.html" %}

{% block contenido %}
<div class="container mt-4">
    <div class="card p-4">
        <h2>Eliminar proveedor</h2>

        <p>
            ¿Estás seguro de que deseas eliminar al proveedor
            <strong>{{ proveedor.nombre }} {{ proveedor.apellido }}</strong>?
        </p>

        <p><strong>RUC:</strong> {{ proveedor.ruc }}</p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Sí, eliminar
            </button>

            <a href="{% url 'facturacion:proveedor_lista' %}" class="btn btn-secondary">
                Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
