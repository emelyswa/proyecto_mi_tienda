
{% extends "base.html" %}

{% block contenido %}
<div class="container mt-4">
    <h2>Detalle de la categoría</h2>

    <div class="card p-4">
        <p><strong>Nombre:</strong> {{ categoria.nombre }}</p>

        <p><strong>Descripción:</strong>
            {{ categoria.descripcion|default:"No registrada" }}
        </p>

        <p><strong>Estado:</strong>
            {% if categoria.activo %}
                <span class="badge bg-success">Activo</span>
            {% else %}
                <span class="badge bg-danger">Inactivo</span>
            {% endif %}
        </p>

        <div class="mt-3">
            <a href="{% url 'facturacion:categoria_lista' %}" class="btn btn-secondary">
                Volver
            </a>

            <a href="{% url 'facturacion:categoria_editar' categoria.pk %}" class="btn btn-warning">
                Editar
            </a>
        </div>
    </div>
</div>
{% endblock %}
