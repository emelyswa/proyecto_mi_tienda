
{% extends "base.html" %}

{% block contenido %}
<div class="container mt-4">
    <h2>Detalle de la marca</h2>

    <div class="card p-4">
        <p><strong>Nombre:</strong> {{ marca.nombre }}</p>

        <p><strong>País de origen:</strong>
            {{ marca.pais_origen|default:"No registrado" }}
        </p>

        <p><strong>Estado:</strong>
            {% if marca.activo %}
                <span class="badge bg-success">Activo</span>
            {% else %}
                <span class="badge bg-danger">Inactivo</span>
            {% endif %}
        </p>

        <div class="mt-3">
            <a href="{% url 'facturacion:marca_lista' %}" class="btn btn-secondary">
                Volver
            </a>

            <a href="{% url 'facturacion:marca_editar' marca.pk %}" class="btn btn-warning">
                Editar
            </a>
        </div>
    </div>
</div>
{% endblock %}
